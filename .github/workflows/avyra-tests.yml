name: Avyra secure handoff tests

on:
  push:
    branches: [main]
    paths:
      - 'src/avyra.js'
      - 'test/avyra.test.js'
      - '.github/workflows/avyra-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/avyra.js'
      - 'test/avyra.test.js'
      - '.github/workflows/avyra-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-handoff:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run Avyra handoff tests
        run: node --test test/avyra.test.js
